apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  annotations:
    internal.config.kubernetes.io/previousKinds: LLMInferenceServiceConfig
    internal.config.kubernetes.io/previousNames: kserve-config-llm-decode-template
    internal.config.kubernetes.io/previousNamespaces: opendatahub
    serving.kserve.io/well-known-config: 'true'
  finalizers:
  - serving.kserve.io/llmisvcconfig-finalizer
  labels:
    platform.opendatahub.io/part-of: kserve
  name: v3-5-2-kserve-config-llm-decode-template
  namespace: redhat-ods-applications
spec:
  annotations:
    serving.kserve.io/model-based-routing-enabled: 'true'
  model:
    uri: ''
  template:
    containers:
    - command:
      - /bin/bash
      - -c
      - "if [ -f /etc/profile.d/ibm-aiu-setup.sh ]; then\n  source /etc/profile.d/ibm-aiu-setup.sh\n\
        fi\n\nif [ \"$KSERVE_INFER_ROCE\" = \"true\" ]; then\n  echo \"Trying to infer\
        \ RoCE configs ... \"\n  grep -H . /sys/class/infiniband/*/ports/*/gids/*\
        \ 2>/dev/null\n  grep -H . /sys/class/infiniband/*/ports/*/gid_attrs/types/*\
        \ 2>/dev/null\n\n  cat /proc/driver/nvidia/params\n\n  KSERVE_INFER_IB_GID_INDEX_GREP=${KSERVE_INFER_IB_GID_INDEX_GREP:-\"\
        RoCE v2\"}\n\n  echo \"[Infer RoCE] Discovering active HCAs ...\"\n  active_hcas=()\n\
        \  # Loop through all mlx5 devices found in sysfs\n  for hca_dir in /sys/class/infiniband/mlx5_*;\
        \ do\n      # Ensure it's a directory before proceeding\n      if [ -d \"\
        $hca_dir\" ]; then\n          hca_name=$(basename \"$hca_dir\")\n        \
        \  port_state_file=\"$hca_dir/ports/1/state\" # Assume port 1\n          type_file=\"\
        $hca_dir/ports/1/gid_attrs/types/*\"\n\n          echo \"[Infer RoCE] Check\
        \ if the port state file ${port_state_file} exists and contains 'ACTIVE'\"\
        \n          if [ -f \"$port_state_file\" ] && grep -q \"ACTIVE\" \"$port_state_file\"\
        \ && grep -q \"${KSERVE_INFER_IB_GID_INDEX_GREP}\" ${type_file} 2>/dev/null;\
        \ then\n              echo \"[Infer RoCE] Found active HCA: $hca_name\"\n\
        \              active_hcas+=(\"$hca_name\")\n          else\n            \
        \  echo \"[Infer RoCE] Skipping inactive or down HCA: $hca_name\"\n      \
        \    fi\n      fi\n  done\n\n  # Check if we found any active HCAs\n  if [\
        \ ${#active_hcas[@]} -gt 0 ]; then\n      # Join the array elements with a\
        \ comma\n      hca_port_pairs=()\n      for hca in \"${active_hcas[@]}\";\
        \ do\n        hca_port_pairs+=(\"${hca}:1\")\n      done\n\n      active_hca_list=$(IFS=,;\
        \ echo \"${active_hcas[*]}\")\n      hca_port_pairs_list=$(IFS=,; echo \"\
        ${hca_port_pairs[*]}\")\n      echo \"[Infer RoCE] Setting active HCAs: ${active_hca_list}\"\
        \n      export NCCL_IB_HCA=${NCCL_IB_HCA:-${active_hca_list}}\n      export\
        \ NVSHMEM_HCA_LIST=${NVSHMEM_HCA_LIST:-${hca_port_pairs_list}}\n      export\
        \ UCX_NET_DEVICES=${UCX_NET_DEVICES:-${hca_port_pairs_list}}\n\n      echo\
        \ \"[Infer RoCE] NCCL_IB_HCA=${NCCL_IB_HCA}\"\n      echo \"[Infer RoCE] NVSHMEM_HCA_LIST=${NVSHMEM_HCA_LIST}\"\
        \n      echo \"[Infer RoCE] UCX_NET_DEVICES=${UCX_NET_DEVICES}\"\n  else\n\
        \      echo \"[Infer RoCE] WARNING: No active RoCE HCAs found. NCCL_IB_HCA\
        \ will not be set.\"\n  fi\n\n  if [ ${#active_hcas[@]} -gt 0 ]; then\n  \
        \    echo \"[Infer RoCE] Finding GID_INDEX for each active HCA (SR-IOV compatible)...\"\
        \n\n      # For SR-IOV environments, find the most common IPv4 RoCE v2 GID\
        \ index across all HCAs\n      declare -A gid_index_count\n      declare -A\
        \ hca_gid_index\n\n      for hca_name in \"${active_hcas[@]}\"; do\n     \
        \     echo \"[Infer RoCE] Processing HCA: ${hca_name}\"\n\n          # Find\
        \ all RoCE v2 IPv4 GIDs for this HCA and count by index\n          for tpath\
        \ in /sys/class/infiniband/${hca_name}/ports/1/gid_attrs/types/*; do\n   \
        \           if grep -q \"${KSERVE_INFER_IB_GID_INDEX_GREP}\" \"$tpath\" 2>/dev/null;\
        \ then\n                  idx=$(basename \"$tpath\")\n                  gid_file=\"\
        /sys/class/infiniband/${hca_name}/ports/1/gids/${idx}\"\n                \
        \  # Check for IPv4 GID (contains ffff:)\n                  if [ -f \"$gid_file\"\
        \ ] && grep -q \"ffff:\" \"$gid_file\"; then\n                      gid_value=$(cat\
        \ \"$gid_file\" 2>/dev/null || echo \"\")\n                      echo \"[Infer\
        \ RoCE] Found IPv4 RoCE v2 GID for ${hca_name}: index=${idx}, gid=${gid_value}\"\
        \n                      hca_gid_index[\"${hca_name}\"]=\"${idx}\"\n      \
        \                gid_index_count[\"${idx}\"]=$((${gid_index_count[\"${idx}\"\
        ]} + 1))\n                      break  # Use first found IPv4 GID per HCA\n\
        \                  fi\n              fi\n          done\n      done\n\n  \
        \    # Find the most common GID index (most likely to be consistent across\
        \ nodes)\n      best_gid_index=\"\"\n      max_count=0\n      for idx in \"\
        ${!gid_index_count[@]}\"; do\n          count=${gid_index_count[\"${idx}\"\
        ]}\n          echo \"[Infer RoCE] GID_INDEX ${idx} found on ${count} HCAs\"\
        \n          if [ $count -gt $max_count ]; then\n              max_count=$count\n\
        \              best_gid_index=\"$idx\"\n          fi\n      done\n\n     \
        \ # Use deterministic fallback if tied - prefer index 3 (SR-IOV standard)\n\
        \      if [ ${#gid_index_count[@]} -gt 1 ]; then\n          echo \"[Infer\
        \ RoCE] Multiple GID indices found, selecting most common: ${best_gid_index}\"\
        \n          # If there's a tie, prefer index 3 as it's most common in SR-IOV\
        \ setups\n          if [ -n \"${gid_index_count['3']}\" ] && [ \"${gid_index_count['3']}\"\
        \ -eq \"$max_count\" ]; then\n              best_gid_index=\"3\"\n       \
        \       echo \"[Infer RoCE] Using deterministic fallback: GID_INDEX=3 (SR-IOV\
        \ standard)\"\n          fi\n      fi\n\n      # Check if GID_INDEX is already\
        \ set via environment variables\n      if [ -n \"${NCCL_IB_GID_INDEX}\" ];\
        \ then\n          echo \"[Infer RoCE] Using pre-configured NCCL_IB_GID_INDEX=${NCCL_IB_GID_INDEX}\
        \ from environment\"\n          export NVSHMEM_IB_GID_INDEX=${NVSHMEM_IB_GID_INDEX:-$NCCL_IB_GID_INDEX}\n\
        \          export UCX_IB_GID_INDEX=${UCX_IB_GID_INDEX:-$NCCL_IB_GID_INDEX}\n\
        \          echo \"[Infer RoCE] Using pre-configured GID_INDEX=${NCCL_IB_GID_INDEX}\
        \ for NCCL, NVSHMEM, and UCX\"\n      elif [ -n \"$best_gid_index\" ]; then\n\
        \          echo \"[Infer RoCE] Selected GID_INDEX: ${best_gid_index} (found\
        \ on ${max_count} HCAs)\"\n\n          export NCCL_IB_GID_INDEX=${NCCL_IB_GID_INDEX:-$best_gid_index}\n\
        \          export NVSHMEM_IB_GID_INDEX=${NVSHMEM_IB_GID_INDEX:-$best_gid_index}\n\
        \          export UCX_IB_GID_INDEX=${UCX_IB_GID_INDEX:-$best_gid_index}\n\n\
        \          echo \"[Infer RoCE] Exported GID_INDEX=${best_gid_index} for NCCL,\
        \ NVSHMEM, and UCX\"\n      else\n          echo \"[Infer RoCE] ERROR: No\
        \ valid IPv4 ${KSERVE_INFER_IB_GID_INDEX_GREP} GID_INDEX found on any HCA.\"\
        \n      fi\n  else\n      echo \"[Infer RoCE] No active HCAs found, skipping\
        \ GID_INDEX inference.\"\n  fi\nfi\n\n# --disable-access-log-for-endpoints\
        \ landed in vLLM 0.16.0 (vllm-project/vllm#30011).\n# Older versions still\
        \ need the blanket --disable-uvicorn-access-log.\nACCESS_LOG_ARGS=\"--disable-uvicorn-access-log\"\
        \nVLLM_VERSION=$(vllm --version 2>/dev/null | tail -1 | awk '{print $NF}')\n\
        echo \"[access-log-detect] vllm version='${VLLM_VERSION}'\"\nif [[ \"$VLLM_VERSION\"\
        \ =~ ^[0-9]+\\.[0-9]+ ]] && [ \"$(printf '%s\\n%s\\n' \"0.16.0\" \"${VLLM_VERSION}\"\
        \ | sort -V | head -1)\" = \"0.16.0\" ]; then\n  ACCESS_LOG_ARGS=\"--disable-access-log-for-endpoints\
        \ /health,/metrics,/ping\"\nfi\necho \"[access-log-detect] selected ACCESS_LOG_ARGS='${ACCESS_LOG_ARGS}'\"\
        \n\n# --shutdown-timeout landed in vLLM 0.18.0 (vllm-project/vllm#36666).\n\
        SHUTDOWN_TIMEOUT_ARGS=\"\"\nif [[ \"$VLLM_VERSION\" =~ ^[0-9]+\\.[0-9]+ ]]\
        \ && [ \"$(printf '%s\\n%s\\n' \"0.18.0\" \"${VLLM_VERSION}\" | sort -V |\
        \ head -1)\" = \"0.18.0\" ]; then\n  SHUTDOWN_TIMEOUT_ARGS=\"--shutdown-timeout\
        \ {{ shutdownTimeout .Spec.Template 15 }}\"\nfi\n\n# --kv-transfer-config\
        \ with OffloadingConnector requires vLLM 0.22.0+ (vllm-project/vllm#40020).\n\
        KV_TRANSFER_ARGS=\"\"\nif [[ \"$VLLM_VERSION\" =~ ^[0-9]+\\.[0-9]+ ]] && [\
        \ \"$(printf '%s\\n%s\\n' \"0.22.0\" \"${VLLM_VERSION}\" | sort -V | head\
        \ -1)\" = \"0.22.0\" ]; then\n  if [[ \"${VLLM_ADDITIONAL_ARGS:-}\" != *\"\
        --kv-transfer-config\"* ]] && [[ \"${VLLM_ADDITIONAL_ARGS:-}\" != *\"--kv_transfer_config\"\
        * ]] && [[ \"$*\" != *\"--kv-transfer-config\"* ]] && [[ \"$*\" != *\"--kv_transfer_config\"\
        * ]]; then\n    KV_TRANSFER_ARGS=\"{{ kvTransferConfig .Spec.KVCacheOffloading\
        \ }}\"\n  fi\nfi\n\neval \"exec vllm serve /mnt/models \\\n  --served-model-name\
        \ \"{{ .Spec.Model.Name }}\" \"publishers/{{ .ObjectMeta.Namespace }}/models/{{\
        \ .Spec.Model.Name }}\" \\\n  --port 8001 \\\n  ${ACCESS_LOG_ARGS} \\\n  ${SHUTDOWN_TIMEOUT_ARGS}\
        \ \\\n  ${KV_TRANSFER_ARGS} \\\n  {{- if and .Spec.Parallelism .Spec.Parallelism.Tensor\
        \ }} --tensor-parallel-size {{ .Spec.Parallelism.Tensor }}{{- end }} \\\n\
        \  {{ if .GlobalConfig.EnableTLS }}--enable-ssl-refresh{{- end }} \\\n  {{\
        \ if .GlobalConfig.EnableTLS }}--ssl-certfile /var/run/kserve/tls/tls.crt{{-\
        \ end }} \\\n  {{ if .GlobalConfig.EnableTLS }}--ssl-keyfile /var/run/kserve/tls/tls.key{{-\
        \ end }} \\\n  ${VLLM_ADDITIONAL_ARGS} \\\n  $@\""
      - --
      env:
      - name: HOME
        value: /home
      - name: VLLM_LOGGING_LEVEL
        value: INFO
      - name: HF_HUB_CACHE
        value: /models
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:fd9540f3882b9aae5f862eba6c295d0e9c6b43f8c17b27b179481bfa330bfbc1
      imagePullPolicy: IfNotPresent
      lifecycle:
        preStop:
          exec:
            command:
            - /bin/sleep
            - '15'
      livenessProbe:
        failureThreshold: 10
        httpGet:
          path: /health
          port: 8001
          scheme: '{{ if .GlobalConfig.EnableTLS }}HTTPS{{else}}HTTP{{- end }}'
        periodSeconds: 10
        timeoutSeconds: 1
      name: main
      ports:
      - containerPort: 8001
        protocol: TCP
      readinessProbe:
        failureThreshold: 2
        httpGet:
          path: /health
          port: 8001
          scheme: '{{ if .GlobalConfig.EnableTLS }}HTTPS{{else}}HTTP{{- end }}'
        periodSeconds: 1
        timeoutSeconds: 1
      resources: {}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: false
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      startupProbe:
        failureThreshold: 60
        httpGet:
          path: /health
          port: 8001
          scheme: '{{ if .GlobalConfig.EnableTLS }}HTTPS{{else}}HTTP{{- end }}'
        periodSeconds: 10
      terminationMessagePath: /dev/termination-log
      terminationMessagePolicy: FallbackToLogsOnError
      volumeMounts:
      - mountPath: /home
        name: home
      - mountPath: /tmp
        name: tmp-dir
      - mountPath: /dev/shm
        name: dshm
      - mountPath: /models
        name: model-cache
      - mountPath: /var/run/kserve/tls
        name: tls-certs
        readOnly: true
    initContainers:
    - command:
      - /app/pd-sidecar
      - --port=8000
      - --vllm-port=8001
      - --kv-connector=nixlv2
      - --enable-ssrf-protection=true
      - --pool-group=inference.networking.x-k8s.io
      - --inference-pool={{ .GlobalConfig.InferencePoolNamespacedName }}
      - '{{ if .GlobalConfig.EnableTLS }}--secure-proxy=true{{else}}--secure-proxy=false{{-
        end }}'
      - '{{ if .GlobalConfig.EnableTLS }}--cert-path=/var/run/kserve/tls{{- end }}'
      - '{{ if .GlobalConfig.EnableTLS }}--enable-tls=decoder{{- end }}'
      - '{{ if .GlobalConfig.EnableTLS }}--enable-tls=prefiller{{- end }}'
      env:
      - name: INFERENCE_POOL_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: SSL_CERT_DIR
        value: /var/run/kserve/tls:/var/run/secrets/kubernetes.io/serviceaccount:/etc/pki/tls/certs
      image: registry.redhat.io/rhoai/odh-llm-d-router-disagg-sidecar-rhel9@sha256:a8c031c2dff1f6742845c3b9e6c85ed66bf5beb62e68d4281c3223dae32b04dc
      imagePullPolicy: IfNotPresent
      livenessProbe:
        failureThreshold: 3
        httpGet:
          path: /health
          port: 8000
          scheme: '{{ if .GlobalConfig.EnableTLS }}HTTPS{{else}}HTTP{{- end }}'
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 10
      name: llm-d-routing-sidecar
      ports:
      - containerPort: 8000
        protocol: TCP
      readinessProbe:
        failureThreshold: 10
        httpGet:
          path: /health
          port: 8000
          scheme: '{{ if .GlobalConfig.EnableTLS }}HTTPS{{else}}HTTP{{- end }}'
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
      resources: {}
      restartPolicy: Always
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: false
        runAsNonRoot: true
      terminationMessagePath: /dev/termination-log
      terminationMessagePolicy: FallbackToLogsOnError
      volumeMounts:
      - mountPath: /var/run/kserve/tls
        name: tls-certs
        readOnly: true
    terminationGracePeriodSeconds: 60
    volumes:
    - emptyDir: {}
      name: home
    - emptyDir: {}
      name: tmp-dir
    - emptyDir:
        medium: Memory
        sizeLimit: 1Gi
      name: dshm
    - emptyDir: {}
      name: model-cache
    - name: tls-certs
      secret:
        secretName: '{{ ChildName .ObjectMeta.Name `-kserve-self-signed-certs` }}'

